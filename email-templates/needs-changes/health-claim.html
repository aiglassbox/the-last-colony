<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{subject}}</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
@media only screen and (max-width:620px){
.kc-col{width:100% !important;}
.kc-pad{padding:28px 20px !important;}
.kc-half{display:block !important;width:100% !important;box-sizing:border-box;}
.kc-gap{display:block !important;height:12px !important;width:100% !important;}
}
</style>
</head>
<body style="margin:0;padding:0;background:#2c441e;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2c441e" style="background:#2c441e;">
<tr><td align="center" style="padding:0 10px;">
<table role="presentation" class="kc-col" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;">
<tr><td align="center" style="padding:28px 0 20px;">
<a href="{{site_url}}" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/kranti-logo.png" width="72" height="60" alt="Kranti Cookbook" style="display:block;border:0;width:72px;height:60px;margin:0 auto;color:#f8a81b;font:bold 16px Georgia,serif;"></a>
</td></tr>
<tr><td class="kc-pad" bgcolor="#ffffff" style="background:#ffffff;border-radius:12px;padding:40px 44px;color:#214513;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td valign="bottom" style="padding:0 0 10px;"><p style="margin:0;font:12px/1.4 Arial,Helvetica,sans-serif;letter-spacing:0.12em;text-transform:uppercase;color:#55703f;">{{recipe_name}} &middot; {{display_name}}</p></td>
<td width="52" align="right" valign="bottom" style="width:52px;padding:0 0 10px 12px;"><img src="{{site_url}}/email-assets/art-bird.png" width="52" height="43" alt="" style="display:block;border:0;width:52px;height:43px;"></td>
</tr>
</table>
<h1 style="margin:0 0 14px;font-family:Lora,Georgia,'Times New Roman',serif;font-weight:500;font-size:28px;line-height:1.25;color:#214513;">{{heading}}</h1>
<table role="presentation" class="kc-two" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:20px;">
<tr>
<td class="kc-half" width="50%" valign="top" bgcolor="#f6efe6" style="width:50%;background:#f6efe6;border-top:4px solid #9a5a12;border-radius:0 0 8px 8px;padding:16px 18px 18px;">
<p style="margin:0 0 8px;font:11px/1.3 Arial,Helvetica,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:#9a5a12;">You wrote</p>
<p style="margin:0;font-family:Lora,Georgia,'Times New Roman',serif;font-style:italic;font-weight:500;font-size:17px;line-height:1.45;color:#6b4a2a;text-decoration:line-through;text-decoration-color:#9a5a12;">{{quoted_line}}</p>
</td>
<td class="kc-gap" width="16" style="width:16px;font-size:0;line-height:0;"><div style="width:16px;"></div></td>
<td class="kc-half" width="50%" valign="top" bgcolor="#fbf3e2" style="width:50%;background:#fbf3e2;border-top:4px solid #2c441e;border-radius:0 0 8px 8px;padding:16px 18px 18px;">
<p style="margin:0 0 8px;font:11px/1.3 Arial,Helvetica,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:#2c441e;">Could read</p>
<p style="margin:0;font-family:Lora,Georgia,'Times New Roman',serif;font-weight:500;font-size:17px;line-height:1.45;color:#214513;">{{suggested_line}}</p>
</td>
</tr>
</table>
<div style="margin-top:24px;font:16px/1.6 Arial,Helvetica,sans-serif;color:#214513;">{{message}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr><td align="center" style="padding-top:26px;"><a href="{{add_recipe_url}}" target="_blank" style="display:inline-block;padding:13px 28px;border-radius:999px;background:#f8a81b;color:#214513;font:bold 15px/1 Arial,Helvetica,sans-serif;text-decoration:none;">Update your recipe</a></td></tr>
</table>
</td></tr>
</table>
</td></tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2c441e" style="background:#2c441e;">
<tr><td align="center" style="padding:28px 16px 36px;font-family:Arial,Helvetica,sans-serif;">
<a href="{{site_url}}" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/kranti-logo.png" width="72" height="60" alt="Kranti Cookbook" style="display:block;border:0;width:72px;height:60px;margin:0 auto 14px;color:#f8a81b;font:bold 16px Georgia,serif;"></a>
<table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="padding:0 5px;"><a href="https://www.instagram.com/kranticookbook/" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-instagram.png" width="28" height="28" alt="Instagram" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
<td style="padding:0 5px;"><a href="https://www.youtube.com/channel/UCOoB6U474PW5jpidGElnJcg" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-youtube.png" width="28" height="28" alt="YouTube" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
<td style="padding:0 5px;"><a href="https://x.com/kranticookbook" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-x.png" width="28" height="28" alt="X" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
</tr></table>
<p style="margin:12px 0 0;font-size:12px;"><a href="{{site_url}}" target="_blank" style="color:#f8a81b;text-decoration:none;">kranticookbook.com</a></p>
<p style="margin:10px auto 0;max-width:420px;font-size:11px;line-height:1.5;color:#c9bda9;">You&#39;re getting this because you shared a recipe with Kranti Cookbook.</p>
</td></tr></table>
</body>
</html>
