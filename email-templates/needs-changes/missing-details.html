<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{subject}}</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
@media only screen and (max-width:620px){
.kc-cell{display:block !important;width:100% !important;box-sizing:border-box;}
.kc-mid{padding:0 12px !important;}
.kc-card{width:100% !important;}
.kc-logo{width:96px !important;margin:0 auto;}
}
</style>
</head>
<body style="margin:0;padding:0;background:#2c441e;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2c441e" style="background:#2c441e;table-layout:fixed;">
<tr>
<td class="kc-cell" align="center" valign="middle" style="padding:24px 12px;">
<a href="{{site_url}}" target="_blank" style="text-decoration:none;"><img class="kc-logo" src="{{site_url}}/email-assets/kranti-logo.png" width="160" height="132" alt="Kranti Cookbook" style="display:block;border:0;width:160px;max-width:100%;height:auto;color:#f8a81b;font:bold 20px Georgia,serif;"></a>
</td>
<td class="kc-cell kc-mid" width="440" valign="middle" style="width:440px;padding:24px 0;">
<table role="presentation" class="kc-card" width="440" cellpadding="0" cellspacing="0" border="0" style="width:440px;">
<tr><td bgcolor="#fbf3e2" style="background:#fbf3e2;border:1.5px dashed #f8a81b;border-radius:10px;padding:24px 28px 26px;color:#214513;">
<p style="margin:0 0 12px;font:12px/1.4 Arial,Helvetica,sans-serif;letter-spacing:0.12em;text-transform:uppercase;color:#55703f;">{{recipe_name}} &middot; {{display_name}}</p>
<h1 style="margin:0 0 10px;font-family:Lora,Georgia,'Times New Roman',serif;font-weight:500;font-size:21px;line-height:1.3;color:#214513;">{{heading}}</h1>
<p style="margin:0 0 8px;font:11px/1.3 Arial,Helvetica,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:#55703f;">Missing</p>
<div>{{#missing}}<span style="display:inline-block;margin:0 2px 8px 0;padding:5px 12px;border-radius:999px;background:#ffffff;border:1.5px dashed #f8a81b;font:bold 12px/1.3 Arial,Helvetica,sans-serif;color:#214513;">{{item}}</span> {{/missing}}</div>
<div style="margin-top:6px;font:15px/1.6 Arial,Helvetica,sans-serif;color:#214513;">{{message}}</div>
</td></tr>
</table>
</td>
<td class="kc-cell" align="center" valign="middle" style="padding:24px 16px;">
<img src="{{site_url}}/email-assets/art-bird.png" width="52" height="43" alt="" style="display:block;border:0;width:52px;height:43px;margin:0 auto;">
</td>
</tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2c441e" style="background:#2c441e;">
<tr><td align="center" style="padding:0 16px;"><a href="{{add_recipe_url}}" target="_blank" style="display:inline-block;padding:13px 28px;border-radius:999px;background:#f8a81b;color:#214513;font:bold 15px/1 Arial,Helvetica,sans-serif;text-decoration:none;">Update your recipe</a></td></tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2c441e" style="background:#2c441e;">
<tr><td align="center" style="padding:28px 16px 36px;font-family:Arial,Helvetica,sans-serif;">
<a href="{{site_url}}" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/kranti-logo.png" width="72" height="60" alt="Kranti Cookbook" style="display:block;border:0;width:72px;height:60px;margin:0 auto 14px;color:#f8a81b;font:bold 16px Georgia,serif;"></a>
<table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="padding:0 5px;"><a href="https://www.instagram.com/kranticookbook/" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-instagram.png" width="28" height="28" alt="Instagram" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
<td style="padding:0 5px;"><a href="https://www.youtube.com/channel/UCOoB6U474PW5jpidGElnJcg" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-youtube.png" width="28" height="28" alt="YouTube" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
<td style="padding:0 5px;"><a href="https://x.com/kranticookbook" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-x.png" width="28" height="28" alt="X" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
</tr></table>
<p style="margin:12px 0 0;font-size:12px;"><a href="{{site_url}}" target="_blank" style="color:#f8a81b;text-decoration:none;">kranticookbook.com</a></p>
<p style="margin:10px auto 0;max-width:420px;font-size:11px;line-height:1.5;color:#c9bda9;">You&#39;re getting this because you shared a recipe with Kranti Cookbook.</p>
</td></tr></table>
</body>
</html>
