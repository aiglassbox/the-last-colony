<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{subject}}</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
@media only screen and (max-width:620px){
.kc-tree{display:none !important;}
.kc-num{font-size:72px !important;}
.kc-col{width:100% !important;}
.kc-pad{padding-left:20px !important;padding-right:20px !important;}
}
</style>
</head>
<body style="margin:0;padding:0;background:#1f4113;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#1f4113" style="background:#1f4113;">
<tr><td align="center" style="padding:0;">
<table role="presentation" class="kc-col" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;">
<tr><td align="center" style="padding:28px 0 8px;">
<a href="{{site_url}}" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/kranti-logo.png" width="72" height="60" alt="Kranti Cookbook" style="display:block;border:0;width:72px;height:60px;margin:0 auto;color:#f8a81b;font:bold 16px Georgia,serif;"></a>
</td></tr>
<tr><td style="padding:0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;">
<tr>
<td class="kc-tree" width="120" valign="bottom" style="width:120px;padding:0;font-size:0;line-height:0;">
<img src="{{site_url}}/email-assets/art-tree-left.png" width="120" height="129" alt="" style="display:block;border:0;width:120px;height:129px;">
</td>
<td class="kc-pad" align="center" valign="middle" style="padding:20px 0 0;text-align:center;">
<table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
<tr><td align="center" style="padding:0 0 18px;">
<table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td width="40" height="2" bgcolor="#f8a81b" style="width:40px;height:2px;font-size:1px;line-height:2px;mso-line-height-rule:exactly;background:#f8a81b;">&nbsp;</td></tr></table>
</td></tr>
<tr><td align="center" class="kc-num" style="font-family:Lora,Georgia,'Times New Roman',serif;font-weight:700;font-size:96px;line-height:1;color:#f8a81b;">{{count}}</td></tr>
<tr><td align="center" style="padding:14px 0 0;font:12px/1.4 Arial,Helvetica,sans-serif;text-transform:uppercase;letter-spacing:0.22em;color:#e4c28e;">readers have asked for</td></tr>
<tr><td align="center" style="padding:6px 0 0;font-family:Lora,Georgia,'Times New Roman',serif;font-style:italic;font-weight:500;font-size:30px;line-height:1.2;color:#e4c28e;">{{recipe_name}}</td></tr>
</table>
</td>
<td class="kc-tree" width="120" valign="bottom" style="width:120px;padding:0;font-size:0;line-height:0;">
<img src="{{site_url}}/email-assets/art-tree-right.png" width="120" height="129" alt="" style="display:block;border:0;width:120px;height:129px;">
</td>
</tr>
</table>
</td></tr>
<tr><td class="kc-pad" align="center" style="padding:32px 48px 6px;font-family:Lora,Georgia,'Times New Roman',serif;font-style:italic;font-weight:500;font-size:18px;line-height:1.4;color:#e4c28e;">{{display_name}},</td></tr>
<tr><td class="kc-pad" align="center" style="padding:0 48px 12px;">
<h1 style="margin:0;font-family:Lora,Georgia,'Times New Roman',serif;font-weight:500;font-size:24px;line-height:1.3;color:#fbf3e2;">{{heading}}</h1>
</td></tr>
<tr><td class="kc-pad" align="center" style="padding:0 48px 8px;font:16px/1.6 Arial,Helvetica,sans-serif;color:#e9e2cf;text-align:center;">{{message}}</td></tr>
</table>
</td></tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#1f4113" style="background:#1f4113;">
<tr><td align="center" style="padding:28px 16px 36px;font-family:Arial,Helvetica,sans-serif;">
<a href="{{site_url}}" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/kranti-logo.png" width="72" height="60" alt="Kranti Cookbook" style="display:block;border:0;width:72px;height:60px;margin:0 auto 14px;color:#f8a81b;font:bold 16px Georgia,serif;"></a>
<table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="padding:0 5px;"><a href="https://www.instagram.com/kranticookbook/" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-instagram.png" width="28" height="28" alt="Instagram" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
<td style="padding:0 5px;"><a href="https://www.youtube.com/channel/UCOoB6U474PW5jpidGElnJcg" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-youtube.png" width="28" height="28" alt="YouTube" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
<td style="padding:0 5px;"><a href="https://x.com/kranticookbook" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-x.png" width="28" height="28" alt="X" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
</tr></table>
<p style="margin:12px 0 0;font-size:12px;"><a href="{{site_url}}" target="_blank" style="color:#f8a81b;text-decoration:none;">kranticookbook.com</a></p>
<p style="margin:10px auto 0;max-width:420px;font-size:11px;line-height:1.5;color:#c9bda9;">You&#39;re getting this because you shared a recipe with Kranti Cookbook.</p>
</td></tr></table>
</body>
</html>
