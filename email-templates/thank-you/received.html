<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{subject}}</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
@media only screen and (max-width:620px){
.kc-col{width:100% !important;}
.kc-pad{padding-left:22px !important;padding-right:22px !important;}
}
</style>
</head>
<body style="margin:0;padding:0;background:#2c441e;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2c441e" style="background:#2c441e;">
<tr><td align="center" style="padding:0 10px;">
<table role="presentation" class="kc-col" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;">
<tr><td align="center" style="padding:32px 0 22px;">
<a href="{{site_url}}" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/kranti-logo.png" width="96" height="80" alt="Kranti Cookbook" style="display:block;border:0;width:96px;height:80px;margin:0 auto;color:#f8a81b;font:bold 18px Georgia,serif;"></a>
</td></tr>
<tr><td bgcolor="#fbf3e2" style="background:#fbf3e2;border-radius:12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
<tr><td height="6" bgcolor="#f8a81b" style="height:6px;background:#f8a81b;border-radius:12px 12px 0 0;font-size:0;line-height:0;">&nbsp;</td></tr>
<tr><td class="kc-pad" align="center" style="padding:30px 44px 0;">
<img src="{{site_url}}/email-assets/art-bird.png" width="52" height="43" alt="" style="display:block;border:0;width:52px;height:43px;margin:0 auto;">
</td></tr>
<tr><td class="kc-pad" align="center" style="padding:16px 44px 0;">
<span style="display:inline-block;padding:5px 12px;border-radius:999px;background:#ffffff;border:1px solid #f8a81b;font:bold 11px/1.3 Arial,Helvetica,sans-serif;letter-spacing:0.08em;text-transform:uppercase;color:#214513;">{{recipe_name}} &middot; {{display_name}}</span>
</td></tr>
<tr><td class="kc-pad" align="center" style="padding:18px 44px 0;">
<h1 style="margin:0;font-family:Lora,Georgia,'Times New Roman',serif;font-weight:500;font-size:28px;line-height:1.25;color:#214513;">{{heading}}</h1>
</td></tr>
<tr><td class="kc-pad" style="padding:20px 44px 0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
<td valign="middle"><div style="border-top:1px solid #e0c99a;font-size:0;line-height:0;">&nbsp;</div></td>
<td width="32" align="center" valign="middle" style="width:32px;font:12px/1 Arial,Helvetica,sans-serif;color:#f8a81b;">&#9670;</td>
<td valign="middle"><div style="border-top:1px solid #e0c99a;font-size:0;line-height:0;">&nbsp;</div></td>
</tr></table>
</td></tr>
<tr><td class="kc-pad" style="padding:20px 44px 36px;font:16px/1.6 Arial,Helvetica,sans-serif;color:#214513;">{{message}}</td></tr>
</table>
</td></tr>
</table>
</td></tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2c441e" style="background:#2c441e;">
<tr><td align="center" style="padding:28px 16px 36px;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="padding:0 5px;"><a href="https://www.instagram.com/kranticookbook/" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-instagram.png" width="28" height="28" alt="Instagram" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
<td style="padding:0 5px;"><a href="https://www.youtube.com/channel/UCOoB6U474PW5jpidGElnJcg" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-youtube.png" width="28" height="28" alt="YouTube" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
<td style="padding:0 5px;"><a href="https://x.com/kranticookbook" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-x.png" width="28" height="28" alt="X" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
</tr></table>
<p style="margin:12px 0 0;font-size:12px;"><a href="{{site_url}}" target="_blank" style="color:#f8a81b;text-decoration:none;">kranticookbook.com</a></p>
<p style="margin:10px auto 0;max-width:420px;font-size:11px;line-height:1.5;color:#c9bda9;">You&#39;re getting this because you shared a recipe with Kranti Cookbook.</p>
</td></tr></table>
</body>
</html>
