<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{subject}}</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
@media only screen and (max-width:620px){
.kc-col{width:100% !important;}
.kc-pad{padding-left:20px !important;padding-right:20px !important;}
.kc-h1{font-size:28px !important;}
}
</style>
</head>
<body style="margin:0;padding:0;background:#2c441e;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2c441e" style="background:#2c441e;">
<tr><td align="center">
<table role="presentation" class="kc-col" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;">
<tr><td align="center" style="padding:32px 0 18px;">
<a href="{{site_url}}" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/kranti-logo.png" width="72" height="60" alt="Kranti Cookbook" style="display:block;border:0;width:72px;height:60px;margin:0 auto;color:#f8a81b;font:bold 16px Georgia,serif;"></a>
</td></tr>
<tr><td class="kc-pad" align="center" style="padding:0 48px 0;">
<h1 class="kc-h1" style="margin:0;font-family:Lora,Georgia,'Times New Roman',serif;font-weight:500;font-size:36px;line-height:1.15;color:#e4c28e;">{{heading}}</h1>
</td></tr>
<tr><td style="padding:0;font-size:0;line-height:0;">
<img src="{{site_url}}/email-assets/art-hero.jpg" width="600" height="338" alt="" style="display:block;border:0;width:100%;height:auto;">
</td></tr>
<tr><td class="kc-pad" align="center" style="padding:28px 48px 12px;font:17px/1.65 Arial,Helvetica,sans-serif;color:#efe6d2;">{{message}}</td></tr>
<tr><td class="kc-pad" style="padding:8px 40px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
{{#prompts}}<tr><td bgcolor="#fbf3e2" style="background:#fbf3e2;border-radius:10px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
<td width="56" align="center" valign="top" style="width:56px;padding:14px 0 16px;"><table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center"><tr><td width="34" height="34" bgcolor="#f8a81b" align="center" valign="middle" style="width:34px;height:34px;border-radius:50%;background:#f8a81b;color:#214513;font:bold 17px/34px Lora,Georgia,serif;text-align:center;">{{n}}</td></tr></table></td>
<td valign="top" style="padding:18px 18px 18px 0;font-family:Lora,Georgia,'Times New Roman',serif;font-weight:500;font-style:italic;font-size:18px;line-height:1.4;color:#214513;">{{item}}</td>
</tr></table>
</td></tr>
<tr><td height="12" style="font-size:0;line-height:0;">&nbsp;</td></tr>{{/prompts}}
</table>
</td></tr>
<tr><td align="center" style="padding:20px 0 8px;">
<a href="{{add_recipe_url}}" target="_blank" style="display:inline-block;padding:15px 34px;border-radius:999px;background:#f8a81b;color:#214513;font:bold 16px/1 Arial,Helvetica,sans-serif;text-decoration:none;">Add a recipe</a>
</td></tr>
</table>
</td></tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2c441e" style="background:#2c441e;">
<tr><td align="center" style="padding:28px 16px 36px;font-family:Arial,Helvetica,sans-serif;">
<a href="{{site_url}}" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/kranti-logo.png" width="72" height="60" alt="Kranti Cookbook" style="display:block;border:0;width:72px;height:60px;margin:0 auto 14px;color:#f8a81b;font:bold 16px Georgia,serif;"></a>
<table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="padding:0 5px;"><a href="https://www.instagram.com/kranticookbook/" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-instagram.png" width="28" height="28" alt="Instagram" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
<td style="padding:0 5px;"><a href="https://www.youtube.com/channel/UCOoB6U474PW5jpidGElnJcg" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-youtube.png" width="28" height="28" alt="YouTube" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
<td style="padding:0 5px;"><a href="https://x.com/kranticookbook" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-x.png" width="28" height="28" alt="X" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
</tr></table>
<p style="margin:12px 0 0;font-size:12px;"><a href="{{site_url}}" target="_blank" style="color:#f8a81b;text-decoration:none;">kranticookbook.com</a></p>
<p style="margin:10px auto 0;max-width:420px;font-size:11px;line-height:1.5;color:#c9bda9;">You&#39;re getting this because you&#39;re on the Kranti Cookbook list. <a href="{{unsubscribe_url}}" target="_blank" style="color:#e4c28e;text-decoration:underline;">Unsubscribe</a></p>
</td></tr></table>
</body>
</html>
