<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{subject}}</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
@media only screen and (max-width:620px){
.kc-cell{display:block !important;width:100% !important;box-sizing:border-box;}
.kc-mid{padding:0 12px !important;}
}
</style>
</head>
<body style="margin:0;padding:0;background:#2c441e;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2c441e" style="background:#2c441e;"><tr><td align="center">
<table role="presentation" align="center" width="780" cellpadding="0" cellspacing="0" border="0" bgcolor="#2c441e" style="width:100%;max-width:780px;background:#2c441e;table-layout:fixed;">
<tr>
<td class="kc-cell" width="170" align="center" valign="middle" style="width:170px;box-sizing:border-box;padding:24px 16px;">
<table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0"><tr>
<td width="132" height="132" align="center" valign="middle" bgcolor="#f8a81b" style="width:132px;height:132px;background:#f8a81b;border:3px double #214513;border-radius:50%;text-align:center;">
<div style="font-family:Lora,Georgia,'Times New Roman',serif;font-weight:700;font-size:26px;line-height:1.1;color:#214513;">{{date_label}}</div>
<div style="margin:6px 0 0;font:9px/1.2 Arial,Helvetica,sans-serif;-webkit-text-size-adjust:none;text-transform:uppercase;letter-spacing:0.18em;color:#214513;">Kranti Cookbook</div>
</td>
</tr></table>
</td>
<td class="kc-cell kc-mid" valign="middle" style="padding:24px 0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
<tr><td bgcolor="#ffffff" style="background:#ffffff;border-radius:10px;padding:26px 30px 28px;color:#214513;">
<h1 style="margin:0 0 12px;font-family:Lora,Georgia,'Times New Roman',serif;font-weight:500;font-size:24px;line-height:1.25;color:#214513;">{{heading}}</h1>
<div style="font:15px/1.6 Arial,Helvetica,sans-serif;color:#214513;">{{message}}</div>
</td></tr>
</table>
</td>
<td class="kc-cell" width="170" align="center" valign="middle" style="width:170px;box-sizing:border-box;padding:24px 16px;">
<img src="{{site_url}}/email-assets/art-bird.png" width="52" height="43" alt="" style="display:block;border:0;width:52px;height:43px;margin:0 auto 14px;">
<a href="{{site_url}}" target="_blank" style="display:inline-block;padding:13px 28px;border-radius:999px;background:#f8a81b;color:#214513;font:bold 15px/1 Arial,Helvetica,sans-serif;text-decoration:none;">Visit Kranti</a>
</td>
</tr>
</table>
</td></tr></table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#2c441e" style="background:#2c441e;">
<tr><td align="center" style="padding:28px 16px 36px;font-family:Arial,Helvetica,sans-serif;">
<a href="{{site_url}}" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/kranti-logo.png" width="72" height="60" alt="Kranti Cookbook" style="display:block;border:0;width:72px;height:60px;margin:0 auto 14px;color:#f8a81b;font:bold 16px Georgia,serif;"></a>
<table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="padding:0 5px;"><a href="https://www.instagram.com/kranticookbook/" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-instagram.png" width="28" height="28" alt="Instagram" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
<td style="padding:0 5px;"><a href="https://www.youtube.com/channel/UCOoB6U474PW5jpidGElnJcg" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-youtube.png" width="28" height="28" alt="YouTube" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
<td style="padding:0 5px;"><a href="https://x.com/kranticookbook" target="_blank" style="text-decoration:none;"><img src="{{site_url}}/email-assets/social-x.png" width="28" height="28" alt="X" style="display:block;border:0;width:28px;height:28px;color:#f8a81b;font:12px Arial,sans-serif;"></a></td>
</tr></table>
<p style="margin:12px 0 0;font-size:12px;"><a href="{{site_url}}" target="_blank" style="color:#f8a81b;text-decoration:none;">kranticookbook.com</a></p>
<p style="margin:10px auto 0;max-width:420px;font-size:11px;line-height:1.5;color:#c9bda9;">You&#39;re getting this because you&#39;re on the Kranti Cookbook list. <a href="{{unsubscribe_url}}" target="_blank" style="color:#e4c28e;text-decoration:underline;">Unsubscribe</a></p>
</td></tr></table>
</body>
</html>
