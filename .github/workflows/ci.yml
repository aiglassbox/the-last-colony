name: ci

# The gates AGENTS.md asks for before a push, run on every pull request instead
# of remembered: the corpus and retrieval harness, lint, build, a dependency
# audit for both packages, and a secret scan over the whole history.
#
# Deliberately `pull_request`, never `pull_request_target`, and no secrets are
# passed: nothing here needs one, and a fork must not be able to reach any.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks reads every commit, not just the checkout.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Offline by construction: none of these load .env or reach a service.
      - run: npm run check
      - run: npm run lint
      - run: npm run build

      - name: audit (app)
        run: npm audit --audit-level=high
      - name: audit (pipeline)
        run: npm audit --audit-level=high
        working-directory: pipeline

      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose
